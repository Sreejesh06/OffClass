services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: cryptid
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - internal

  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/cryptid
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
    depends_on:
      - db
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - internal

  api:
    build: 
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://cryptid_app:${APP_DB_PASSWORD:-app_password}@pgbouncer:6432/cryptid?pgbouncer=true
      - DIRECT_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/cryptid
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-super_secret_fallback_key}
    depends_on:
      - pgbouncer
      - redis
    networks:
      - internal
      - proxy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./client/dist:/var/www/html
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      - proxy

volumes:
  pg_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  # Internal network isolates the databases completely from the host/internet
  internal:
    internal: true
  proxy:
